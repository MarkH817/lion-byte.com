name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm i -g npm@12
      - run: npm ci
      - run: npm run lex:build
      - run: npm test
